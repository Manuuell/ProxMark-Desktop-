<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2734" />
      <stop offset="0.55" stop-color="#0e141c" />
      <stop offset="1" stop-color="#05080c" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="coil" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6fe6f6" />
      <stop offset="0.55" stop-color="#38d1e7" />
      <stop offset="1" stop-color="#17a0b6" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185" />
    </clipPath>
  </defs>

  <!-- cuerpo del icono -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)" />
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="380" fill="url(#gloss)" />
  </g>
  <rect x="102" y="102" width="820" height="820" rx="184" ry="184" fill="none"
        stroke="#ffffff" stroke-opacity="0.14" stroke-width="4" />

  <g filter="url(#glow)">
    <!-- ondas RF -->
    <g fill="none" stroke="url(#coil)" stroke-width="26" stroke-linecap="round">
      <path d="M 784 385 A 300 300 0 0 0 639 258" opacity="1" />
      <path d="M 836 360 A 358 358 0 0 0 663 209" opacity="0.74" />
      <path d="M 889 336 A 416 416 0 0 0 688 159" opacity="0.5" />
    </g>

    <!-- bobina de antena -->
    <path d="M 342 610 L 342 342 L 682 342 L 682 682 L 410 682 L 410 410 L 614 410 L 614 614 L 505 614"
          fill="none" stroke="url(#coil)" stroke-width="30"
          stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="512" cy="512" r="30" fill="url(#coil)" />
  </g>
</svg>
